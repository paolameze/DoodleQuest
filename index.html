<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodleQuest - Interactive App</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif, system-ui; }
        body { background-color: #fff0f3; display: flex; min-height: 100vh; }

        /* Left Sidebar - Width 320px */
        aside.sidebar {
            width: 320px; 
            background-color: #ffb6c1; 
            border-right: 2px solid #ff9ebb;
            padding: 40px 25px; 
            display: flex; 
            flex-direction: column; 
            position: fixed; 
            height: 100vh; 
            top: 0; 
            left: 0;
        }

        .logo-container {
            text-align: left;
            margin-bottom: 40px;
        }
        
        .logo-img {
            max-width: 270px; 
            height: auto;
        }

        .nav-menu { display: flex; flex-direction: column; gap: 15px; }
        
        /* Larger Navigation Buttons & Text with Custom Icons */
        .nav-item {
            display: flex; 
            align-items: center; 
            gap: 15px; 
            padding: 16px 22px; 
            background: transparent;
            border: none; 
            border-radius: 14px; 
            font-size: 21px; 
            font-weight: 600; 
            color: white; 
            cursor: pointer; 
            transition: background 0.2s; 
            text-align: left;
            width: 100%;
        }
        .nav-item:hover, .nav-item.active { background-color: rgba(255, 255, 255, 0.4); color: #d1496b; }

        .nav-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            pointer-events: none;
        }

        /* Main Content Container - Shifted right to match wider sidebar */
        main.main-content { 
            margin-left: 320px; 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px; 
        }
        .content-wrapper { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 25px; }

        .view-section { display: none; flex-direction: column; gap: 20px; }
        .view-section.active { display: flex; }

        /* Ticket Card Styling */
        .ticket-card { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(255, 150, 175, 0.2); overflow: hidden; border: 2px solid #ffd1dc; }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f9eeef; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #d1496b; }
        
        /* Custom Avatar Image Styling */
        .avatar-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ff9ebb;
        }

        .difficulty-badge { font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; background-color: #ffe5ea; color: #d1496b; }
        .card-body { padding: 15px; color: #555; font-size: 14px; line-height: 1.5; }
        .card-image-box img { width: 100%; max-height: 300px; object-fit: cover; border-top: 1px solid #f9eeef; border-bottom: 1px solid #f9eeef; }
        .card-actions { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-join { background-color: #ff7597; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .btn-join:hover { background-color: #e05e7e; }

        /* Create Form & Profile Styling */
        .create-form { background: white; padding: 25px; border-radius: 16px; border: 2px solid #ffd1dc; display: flex; flex-direction: column; gap: 15px; }
        .create-form h2 { color: #d1496b; margin-bottom: 5px; }
        .create-form label { font-size: 14px; font-weight: 600; color: #666; }
        .create-form input, .create-form textarea, .create-form select {
            width: 100%; padding: 10px; border: 1px solid #ffd1dc; border-radius: 8px; font-size: 14px; outline: none; background: #fff8fa;
        }
        .create-form button { background-color: #ff7597; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
        <div class="logo-container">
            <img src="logo.png" alt="DoodleQuest Logo" class="logo-img">
        </div>
        <div class="nav-menu">
            <button class="nav-item active" id="btn-feed" data-view="feed">
                <img src="home-icon.png" alt="Feed" class="nav-icon"> Feed
            </button>
            <button class="nav-item" id="btn-tickets" data-view="tickets">
                <img src="tickets-icon.png" alt="Tickets" class="nav-icon"> Tickets
            </button>
            <button class="nav-item" id="btn-create" data-view="create">
                <img src="create-icon.png" alt="Create" class="nav-icon"> Create
            </button>
            <button class="nav-item" id="btn-profile" data-view="profile">
                <img src="profile-icon.png" alt="Profile" class="nav-icon"> Profile
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
        <div class="content-wrapper">
            
            <!-- VIEW 1: FEED -->
            <div id="feedView" class="view-section active">
                <h2 style="color: #d1496b;">Live Community Feed</h2>
                <div id="ticketsFeed">
                    <p style="color: #888; text-align: center;">Loading tickets from database...</p>
                </div>
            </div>

            <!-- VIEW 2: MY TICKETS / IN PROGRESS -->
            <div id="ticketsView" class="view-section">
                <h2 style="color: #d1496b;">Tickets In Progress</h2>
                <p style="color: #666; font-size: 14px;">Here are tickets you've joined or created to submit drawings.</p>
                <div id="joinedTicketsFeed">
                    <p style="color: #888;">No active tickets joined yet.</p>
                </div>
            </div>

            <!-- VIEW 3: CREATE TICKET FORM -->
            <div id="createView" class="view-section">
                <div class="create-form">
                    <h2>Create Drawing Ticket</h2>
                    <p style="font-size: 13px; color: #777;">Submit a drawing prompt for community artists!</p>
                    
                    <label>Your Username</label>
                    <input type="text" id="creatorName" placeholder="@lumina" value="@lumina">

                    <label>Title / Summary</label>
                    <input type="text" id="ticketTitle" placeholder="e.g. Cat wizard sketch">

                    <label>Description Request</label>
                    <textarea id="ticketDesc" rows="3" placeholder="Describe what you want drawn..."></textarea>

                    <label>Difficulty</label>
                    <select id="ticketDifficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>

                    <label>Reference Image File</label>
                    <input type="file" id="ticketFile" accept="image/*">

                    <button onclick="publishTicket()">Publish Ticket 🚀</button>
                </div>
            </div>

            <!-- VIEW 4: PROFILE -->
            <div id="profileView" class="view-section">
                <div class="create-form" style="text-align: center; align-items: center;">
                    <img src="avatar.png" alt="Profile Picture" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #ff9ebb; margin-bottom: 10px;">
                    <h2 style="color: #d1496b;">@lumina</h2>
                    <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Digital Artist ✨</p>
                    
                    <div style="display: flex; gap: 20px; width: 100%; justify-content: center; border-top: 1px solid #ffd1dc; border-bottom: 1px solid #ffd1dc; padding: 15px 0; margin-bottom: 15px;">
                        <div>
                            <strong style="display: block; color: #d1496b; font-size: 18px;">12</strong>
                            <span style="font-size: 12px; color: #888;">Tickets Posted</span>
                        </div>
                        <div>
                            <strong style="display: block; color: #d1496b; font-size: 18px;">5</strong>
                            <span style="font-size: 12px; color: #888;">Completed</span>
                        </div>
                    </div>
                    
                    <button class="btn-join" style="width: 100%; padding: 10px;" onclick="alert('Profile settings coming soon!')">Edit Profile ⚙️</button>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
